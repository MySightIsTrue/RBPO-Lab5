services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Fill .env}
      POSTGRES_USER: ${POSTGRES_USER:?Fill .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Fill .env}
      DB_USER: ${DB_USER:?Fill .env}
      DB_PASSWORD: ${DB_PASSWORD:?Fill .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
